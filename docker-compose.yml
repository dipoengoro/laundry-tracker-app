# docker-compose.yml

version: '3.8'

services:
    # Layanan untuk Database
    db:
        image: postgres:15-alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_USER=laundryuser
            - POSTGRES_PASSWORD=laundrypass
            - POSTGRES_DB=laundrydb
        ports:
            - "5432:5432"

    # Layanan untuk Backend FastAPI
    backend:
        build: ./backend
        # Perintah ini menjalankan server uvicorn dengan auto-reload
        command: uvicorn app.main:app --host 0.0.0.0 --reload
        volumes:
            - ./backend:/app
        ports:
            - "8000:8000"
        environment:
            - POSTGRES_USER=laundryuser
            - POSTGRES_PASSWORD=laundrypass
            - POSTGRES_DB=laundrydb
        depends_on:
            - db

    # Layanan untuk Frontend Vue/Vite
    frontend:
        build: ./frontend
        command: npm run dev -- --host
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - "5173:5173"

volumes:
    postgres_data: