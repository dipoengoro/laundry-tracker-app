# docker-compose.yml

version: '3.8'

services:
    # Layanan untuk Database
    db:
        image: postgres:15-alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
        ports:
            - "5432:5432"
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
          interval: 5s
          timeout: 5s
          retries: 5


    # Layanan untuk Backend FastAPI
    backend:
        build: ./backend
        # Perintah ini menjalankan server uvicorn dengan auto-reload
        command: uvicorn app.main:app --host 0.0.0.0 --reload --log-config app/log_conf.yaml
        volumes:
            - ./backend:/app
            - ./backend_static:/app/static
        ports:
            - "8000:8000"
        environment:
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DB=${POSTGRES_DB}
            - JWT_SECRET_KEY=${JWT_SECRET_KEY}
            - JWT_ALGORITHM=${JWT_ALGORITHM}
            - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
            - MAIL_SERVER=${MAIL_SERVER}
            - MAIL_PORT=${MAIL_PORT}
            - MAIL_USERNAME=${MAIL_USERNAME}
            - MAIL_PASSWORD=${MAIL_PASSWORD}
            - MAIL_FROM=${MAIL_FROM}
        depends_on:
            db:
                condition: service_healthy

    # Layanan untuk Frontend Vue/Vite
    frontend:
        build: ./frontend
        command: npm run dev -- --host
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - "5173:5173"
        stdin_open: true
        tty: true

    mailhog:
        image: mailhog/mailhog
        ports:
            - "1025:1025"
            - "8025:8025"

    loki:
        image: grafana/loki:latest
        ports:
            - "3100:3100"
        volumes:
            - loki_data:/loki
    
    promtail:
        image: grafana/promtail:latest
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./promtail-config.yml:/etc/promtail/config.yml
        command: -config.file=/etc/promtail/config.yml

    grafana:
        image: grafana/grafana:latest
        ports:
            - "3000:3000"
        volumes:
            - grafana_data:/var/lib/grafana

volumes:
    postgres_data:
    backend_static:
    grafana_data:
    loki_data: